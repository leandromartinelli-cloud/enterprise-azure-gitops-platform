name: Sample App CI

on:
  push:
    branches:
      - main
    paths:
      - "src/sample-app/**"
      - ".github/workflows/sample-app-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "src/sample-app/**"
      - ".github/workflows/sample-app-ci.yml"

  workflow_dispatch:

permissions:
  contents: write

env:
  ACR_NAME: acrentgitopsdev29xa5r
  ACR_LOGIN_SERVER: acrentgitopsdev29xa5r.azurecr.io
  IMAGE_NAME: sample-app

jobs:
  build:
    name: Build and Push Sample App
    runs-on:
      - self-hosted
      - linux
      - azure
      - private

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login with managed identity
        run: |
          az login --identity --output none
          echo "Azure managed identity authentication successful."

      - name: Login to private ACR
        run: |
          az acr login --name "$ACR_NAME"

      - name: Generate image tag
        id: image
        shell: bash
        run: |
          IMAGE_TAG="${GITHUB_SHA::12}"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Image tag: $IMAGE_TAG"

      - name: Build Docker image
        run: |
          docker build \
            --tag "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ steps.image.outputs.tag }}" \
            ./src/sample-app

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker push \
            "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ steps.image.outputs.tag }}"

      - name: Update GitOps image tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          IMAGE_TAG="${{ steps.image.outputs.tag }}"
          KUSTOMIZATION="apps/sample-app/overlays/dev/kustomization.yaml"

          echo "Updating GitOps image tag to: $IMAGE_TAG"

          sed -i \
            "s/newTag: .*/newTag: $IMAGE_TAG/" \
            "$KUSTOMIZATION"

          echo "Updated kustomization:"
          grep -A2 "images:" "$KUSTOMIZATION"

      - name: Commit GitOps image update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          IMAGE_TAG="${{ steps.image.outputs.tag }}"

          if git diff --quiet -- apps/sample-app/overlays/dev/kustomization.yaml; then
            echo "GitOps image tag is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps/sample-app/overlays/dev/kustomization.yaml
          git commit -m "chore(gitops): deploy sample-app $IMAGE_TAG"
          git push origin HEAD:main