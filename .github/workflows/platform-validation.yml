name: Platform Validation

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    name: Validate Private AKS Platform
    runs-on:
      - self-hosted
      - Linux
      - X64
      - azure
      - private

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group rg-enterprise-gitops-dev-brazilsouth \
            --name aks-enterprise-gitops-dev-brazilsouth \
            --overwrite-existing

      - name: Validate nodes
        run: kubectl get nodes -o wide

      - name: Validate workloads
        run: kubectl get pods -A

      - name: Validate Argo CD applications
        run: kubectl get applications -A