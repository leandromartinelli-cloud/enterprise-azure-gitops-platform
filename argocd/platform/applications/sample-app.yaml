apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-app-dev
  namespace: argocd
spec:
  project: enterprise-platform

  source:
    repoURL: https://github.com/leandromartinelli-cloud/enterprise-azure-gitops-platform.git
    targetRevision: main
    path: apps/sample-app/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: sample-app-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true