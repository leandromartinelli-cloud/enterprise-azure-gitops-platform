apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: sample-app
      containers:
        - name: sample-app
          image: acrentgitopsdev29xa5r.azurecr.io/sample-app
          ports:
            - containerPort: 8080
          env:
            - name: KEY_VAULT_URL
              value: "https://kv-entgitops-dev-29xa5r.vault.azure.net/"
            - name: SECRET_NAME
              value: "sample-app-message"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi